name: TahoePreview
options:
  bundleIdPrefix: com.aault.tahoe
  deploymentTarget:
    iOS: '17.5'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  TahoePreview:
    type: application
    platform: iOS
    sources:
      - path: ..
        excludes: ['preview/**', '*Tests.swift', 'Guest.swift', '*.py', 'README.md', 'Notices/**', '__pycache__/**']
      - path: PreviewApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aault.tahoedesktop.preview
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) TAHOE_PREVIEW'
        TARGETED_DEVICE_FAMILY: '2'
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Generated-Preview-Info.plist
      properties:
        CFBundleDisplayName: Tahoe Preview
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Allow camera access for websites when requested.
        NSMicrophoneUsageDescription: Allow microphone access for websites when requested.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
  TahoePreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TahoePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aault.tahoedesktop.preview.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TahoePreview:
    build:
      targets:
        TahoePreview: all
    test:
      targets: [TahoePreviewUITests]
