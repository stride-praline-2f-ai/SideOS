name: SideOSBrowser
options:
  deploymentTarget:
    iOS: '17.5'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    MARKETING_VERSION: '3.1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_OBJC_BRIDGING_HEADER: Shared/SigningSnapshot.h
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SideOSBrowser:
    type: application
    platform: iOS
    sources: [Browser, Shared]
    entitlements:
      path: Browser.entitlements
      properties:
        get-task-allow: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aault.sideos.browser
    info:
      path: Generated-Browser.plist
      properties:
        CFBundleDisplayName: SideOS Browser
        CFBundleURLTypes:
          - CFBundleURLName: com.aault.sideos.browser.open
            CFBundleURLSchemes: [sideos-isolated-browser]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Allow a website to use your camera only after you approve its request.
        NSMicrophoneUsageDescription: Allow a website to use your microphone only after you approve its request.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
  SideOSIsolationProbe:
    type: application
    platform: iOS
    sources: [Probe, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aault.sideos.isolationprobe
    info:
      path: Generated-Probe.plist
      properties:
        CFBundleDisplayName: Isolation Probe
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
